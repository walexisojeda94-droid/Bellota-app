plugins {
    id 'com.android.application'
}

def signingStoreFile = System.getenv('BELLOTA_KEYSTORE_FILE')
def signingStorePassword = System.getenv('BELLOTA_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('BELLOTA_KEY_ALIAS')
def signingKeyPassword = System.getenv('BELLOTA_KEY_PASSWORD')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    namespace 'com.bellota.mascota'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bellota.mascota'
        minSdk 27
        targetSdk 28
        versionCode 6
        versionName '0.4.2'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    lint {
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    dependencies {
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'com.plasmoverse:concentus:1.0.0'
    }
}
