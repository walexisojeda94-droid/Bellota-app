plugins {
    id 'com.android.application'
}

def signingStoreFile = System.getenv('BELLOTA_KEYSTORE_FILE')
def signingStorePassword = System.getenv('BELLOTA_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('BELLOTA_KEY_ALIAS')
def signingKeyPassword = System.getenv('BELLOTA_KEY_PASSWORD')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.bellota.mascota'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bellota.mascota'
        minSdk 24
        targetSdk 28
        versionCode 8
        versionName '0.4.4'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError true
        // Bellota se distribuye por instalación privada, no por Google Play.
        // Se conserva targetSdk 28 para evitar cambios de comportamiento no validados
        // en el dispositivo objetivo Android 8.1 (API 27).
        disable += 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // WebRTC ya está en la versión estable más reciente disponible al revisar.
    implementation 'io.github.webrtc-sdk:android:150.7871.08'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
