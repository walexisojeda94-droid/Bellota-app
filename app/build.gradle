plugins {
    id 'com.android.application'
}

def signingStoreFile = System.getenv('BELLOTA_KEYSTORE_FILE')
def signingStorePassword = System.getenv('BELLOTA_KEYSTORE_PASSWORD')
def signingKeyAlias = System.getenv('BELLOTA_KEY_ALIAS')
def signingKeyPassword = System.getenv('BELLOTA_KEY_PASSWORD')
def hasReleaseSigning = signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword

dependencyLocking {
    lockAllConfigurations()
}

// OSV-Scanner detected vulnerable transitive versions in the resolved Android
// and test toolchains. Keep related modules aligned across every configuration.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.netty') {
            details.useVersion '4.1.137.Final'
            details.because 'Resolve Netty security advisories reported by OSV'
        } else if (details.requested.group == 'com.google.guava'
                && details.requested.name == 'guava') {
            details.useVersion '33.7.2-jre'
            details.because 'Resolve Guava security advisory reported by OSV'
        } else if (details.requested.group == 'com.google.protobuf') {
            details.useVersion '3.25.5'
            details.because 'Resolve Protobuf security advisory reported by OSV'
        } else if (details.requested.group == 'org.json'
                && details.requested.name == 'json') {
            details.useVersion '20260719'
            details.because 'Resolve JSON security advisory reported by OSV'
        }
    }
}

android {
    buildFeatures {
        buildConfig true
    }

    namespace 'com.bellota.mascota'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bellota.mascota'
        minSdk 24
        targetSdk 28
        versionCode 10
        versionName '0.4.6'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError true
        // Bellota se distribuye por instalación privada, no por Google Play.
        // Se conserva targetSdk 28 para evitar cambios de comportamiento no validados
        // en el dispositivo objetivo Android 8.1 (API 27).
        disable += 'ExpiredTargetSdkVersion'
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // WebRTC ya está en la versión estable más reciente disponible al revisar.
    implementation 'io.github.webrtc-sdk:android:150.7871.08'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
