name: Build Bellota APK
on:
  push:
    branches: [main, 'fix/xiaozhi-voice-pipeline', 'fix/revision-6-backend-persistence', 'fix/revision-7-build-dependencies-tests']
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
  pull_request:
    branches: [main]
concurrency:
  group: bellota-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review dependency changes for known vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Worker JavaScript and D1 migration
        run: |
          node --check backend/openai-realtime/src/index.js
          npm --prefix backend/openai-realtime test
          python3 - <<'PY'
          import pathlib
          import sqlite3

          root = pathlib.Path("backend/openai-realtime")
          db = sqlite3.connect(":memory:")
          db.executescript("""
            CREATE TABLE pairing_codes (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              code_hash TEXT NOT NULL UNIQUE,
              created_at INTEGER NOT NULL,
              expires_at INTEGER NOT NULL,
              consumed_at INTEGER
            );
            CREATE TABLE devices (
              id TEXT PRIMARY KEY,
              device_name TEXT NOT NULL,
              refresh_token_hash TEXT NOT NULL UNIQUE,
              created_at INTEGER NOT NULL,
              refresh_expires_at INTEGER NOT NULL,
              last_seen_at INTEGER,
              revoked_at INTEGER
            );
          """)
          db.executescript((root / "migrations/0001_recoverable_refresh.sql").read_text())
          db.executescript((root / "migrations/0002_retention_indexes.sql").read_text())
          columns = {row[1] for row in db.execute("PRAGMA table_info(devices)")}
          pairing_columns = {row[1] for row in db.execute("PRAGMA table_info(pairing_codes)")}
          assert {"previous_refresh_token_hash", "previous_refresh_valid_until"} <= columns
          assert "device_id" in pairing_columns
          indexes = {row[1] for row in db.execute("PRAGMA index_list(devices)")}
          assert {"idx_devices_revoked_at", "idx_devices_refresh_expiry"} <= indexes

          db.execute("INSERT INTO pairing_codes (code_hash, created_at, expires_at) VALUES ('one-code', 100, 200)")
          def batch_pair(device_id):
              with db:
                  changed = db.execute(
                      "UPDATE pairing_codes SET consumed_at = ?, device_id = ? "
                      "WHERE code_hash = ? AND consumed_at IS NULL AND expires_at > ?",
                      (150, device_id, "one-code", 150)
                  ).rowcount
                  inserted = db.execute(
                      "INSERT INTO devices (id, device_name, refresh_token_hash, created_at, refresh_expires_at) "
                      "SELECT ?, ?, ?, ?, ? WHERE EXISTS "
                      "(SELECT 1 FROM pairing_codes WHERE code_hash = ? AND consumed_at = ? AND device_id = ?)",
                      (device_id, "test", "hash-" + device_id, 150, 999, "one-code", 150, device_id)
                  ).rowcount
                  return changed, inserted

          assert batch_pair("device-a") == (1, 1)
          assert batch_pair("device-b") == (0, 0)
          assert db.execute("SELECT COUNT(*) FROM devices").fetchone()[0] == 1

          now = 1_000_000_000
          db.executemany(
              "INSERT INTO pairing_codes (code_hash, created_at, expires_at, consumed_at) VALUES (?, ?, ?, ?)",
              [
                  ("pair-old-unused", now - 9 * 86400, now - 8 * 86400, None),
                  ("pair-old-used", now - 9 * 86400, now - 8 * 86400, now - 8 * 86400),
                  ("pair-recent", now - 2 * 86400, now - 1 * 86400, None),
              ]
          )
          db.execute(
              "DELETE FROM pairing_codes WHERE expires_at < ? AND (consumed_at IS NULL OR consumed_at < ?)",
              (now - 7 * 86400, now - 7 * 86400)
          )
          retained_codes = {row[0] for row in db.execute("SELECT code_hash FROM pairing_codes")}
          assert "pair-old-unused" not in retained_codes
          assert "pair-old-used" not in retained_codes
          assert "pair-recent" in retained_codes

          db.executemany(
              "INSERT INTO devices (id, device_name, refresh_token_hash, created_at, refresh_expires_at, revoked_at) "
              "VALUES (?, ?, ?, ?, ?, ?)",
              [
                  ("device-old-revoked", "test", "hash-old-revoked", now - 200 * 86400, now - 100 * 86400, now - 181 * 86400),
                  ("device-recently-revoked", "test", "hash-recent-revoked", now - 200 * 86400, now - 181 * 86400, now - 1 * 86400),
                  ("device-old-expired", "test", "hash-old-expired", now - 200 * 86400, now - 181 * 86400, None),
                  ("device-recent-expired", "test", "hash-recent-expired", now - 200 * 86400, now - 179 * 86400, None),
              ]
          )
          db.execute(
              "DELETE FROM devices WHERE (revoked_at IS NOT NULL AND revoked_at < ?) OR "
              "(revoked_at IS NULL AND refresh_expires_at < ?)",
              (now - 180 * 86400, now - 180 * 86400)
          )
          retained_devices = {row[0] for row in db.execute("SELECT id FROM devices")}
          assert "device-old-revoked" not in retained_devices
          assert "device-old-expired" not in retained_devices
          assert "device-recently-revoked" in retained_devices
          assert "device-recent-expired" in retained_devices
          print("D1 migration, atomic pairing and retention SQL checks passed.")
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Resolve and lock Gradle dependency graph
        run: ./gradlew --no-daemon :app:dependencies --write-locks
      - name: Set up Go for OSV-Scanner
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Audit resolved dependencies with OSV-Scanner
        run: go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1 scan source --recursive ./
      - name: Check permanent signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BELLOTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BELLOTA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BELLOTA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BELLOTA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bellota-release.jks"
            echo "BELLOTA_KEYSTORE_FILE=$RUNNER_TEMP/bellota-release.jks" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build minified Release variant
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Generate CycloneDX SBOM
        run: ./gradlew --no-daemon cyclonedxBom
      - name: Create SBOM integrity checksum
        run: sha256sum build/reports/cyclonedx/bom.json > build/reports/cyclonedx/bom.json.sha256
      - name: Upload SBOM and resolved dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bellota-sbom-cyclonedx
          path: |
            build/reports/cyclonedx/bom.json
            build/reports/cyclonedx/bom.json.sha256
            app/gradle.lockfile
          if-no-files-found: error
          retention-days: 90
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bellota-qa-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build API 24 smoke-test APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Smoke test on Android 7 (API 24)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted Linux runners do not expose KVM. Android Emulator
          # requires this opt-in to use its software CPU emulation (TCG).
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 24
          arch: x86
          profile: Nexus 5
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb shell am force-stop com.bellota.mascota
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            adb shell monkey -p com.bellota.mascota -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.bellota.mascota
            adb shell input keyevent 26
            sleep 5
            adb shell pidof com.bellota.mascota
            adb shell input keyevent 26
            adb shell am force-stop com.bellota.mascota
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            adb shell monkey -p com.bellota.mascota -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.bellota.mascota
            adb shell pidof com.bellota.mascota
      - name: Smoke test on Android 8.1 (API 27)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 27
          arch: x86
          profile: Nexus 5
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb shell am force-stop com.bellota.mascota
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            adb shell monkey -p com.bellota.mascota -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.bellota.mascota
            adb shell input keyevent 26
            sleep 5
            adb shell pidof com.bellota.mascota
            adb shell input keyevent 26
            adb shell am force-stop com.bellota.mascota
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            adb shell monkey -p com.bellota.mascota -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.bellota.mascota
            adb shell pidof com.bellota.mascota
      - name: Smoke test on Android 12 (API 31)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 31
          arch: x86_64
          profile: Nexus 5
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb shell am force-stop com.bellota.mascota
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            adb shell monkey -p com.bellota.mascota -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.bellota.mascota
            adb shell input keyevent 26
            sleep 5
            adb shell pidof com.bellota.mascota
            adb shell input keyevent 26
            adb shell am force-stop com.bellota.mascota
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.bellota.mascota android.permission.RECORD_AUDIO
            adb shell monkey -p com.bellota.mascota -c android.intent.category.LAUNCHER 1
            sleep 10
            adb shell pidof com.bellota.mascota
            adb shell pidof com.bellota.mascota
            ! adb logcat -d -t 2000 | grep -A 8 -F "FATAL EXCEPTION" | grep -F "com.bellota.mascota"
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          BELLOTA_KEYSTORE_PASSWORD: ${{ secrets.BELLOTA_KEYSTORE_PASSWORD }}
          BELLOTA_KEY_ALIAS: ${{ secrets.BELLOTA_KEY_ALIAS }}
          BELLOTA_KEY_PASSWORD: ${{ secrets.BELLOTA_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify permanent signing certificate
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -qi "762b29d736275f544cb617ae48a268f71a3f23584f38bc6217d3c33f81d3948f" "$RUNNER_TEMP/signature.txt"
      - name: Build temporary debug APK (until permanent key is configured)
        if: steps.signing.outputs.enabled != 'true'
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bellota-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload temporary debug APK
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bellota-debug-apk-temporal
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
