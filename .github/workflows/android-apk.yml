name: Build Bellota APK
on:
  push:
    branches: [main, 'fix/xiaozhi-voice-pipeline']
  workflow_dispatch:
env:
  ANDROID_HOME: /usr/local/lib/android/sdk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Check permanent signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.BELLOTA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BELLOTA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BELLOTA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BELLOTA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bellota-release.jks"
            echo "BELLOTA_KEYSTORE_FILE=$RUNNER_TEMP/bellota-release.jks" >> "$GITHUB_ENV"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          BELLOTA_KEYSTORE_PASSWORD: ${{ secrets.BELLOTA_KEYSTORE_PASSWORD }}
          BELLOTA_KEY_ALIAS: ${{ secrets.BELLOTA_KEY_ALIAS }}
          BELLOTA_KEY_PASSWORD: ${{ secrets.BELLOTA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify permanent signing certificate
        if: steps.signing.outputs.enabled == 'true'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          grep -qi "762b29d736275f544cb617ae48a268f71a3f23584f38bc6217d3c33f81d3948f" "$RUNNER_TEMP/signature.txt"
      - name: Build temporary debug APK (until permanent key is configured)
        if: steps.signing.outputs.enabled != 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bellota-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload temporary debug APK
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bellota-debug-apk-temporal
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
